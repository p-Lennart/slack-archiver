<!DOCTYPE html>
<html>
    <head>
        <script src = 'urlParams.js'></script>
        <script src = 'misc.js'></script>
        <script async type = "module">
            const { jml, jml_nester } = await import('./jml.mjs');

            let params = getURLParameters();
            
            if (!params.type || !params.id) {
                console.log('Missing parameters'); 
            } else {
                let dir = `../archives/${params.type}/${params.id}`;
                console.log(dir);

                init(dir, params.ts);
            }

            function makeFilename(string, removeLast) {
                string = string.split('.');
                if (removeLast) string = string.slice(0, -1);
                return string.join('-');
            }

            function renderMemberUI(members) {
                const memberNodes = [];
                for (const i of members) {
                    let mem = jml('div', { class: 'user'}, [
                        jml('img', { class: 'user_picture', src: i.profile['image_72'] }, ),
                        jml('div', { class: 'user_text'}, [
                            jml('h3', {}, getPrettyName(i)),
                            jml('h5', {}, '@' + i.name),
                            jml('span', {}, i.profile.title),
                        ]),
                    ]);
                    memberNodes.push(mem);
                }
                return memberNodes;
            }

            function renderMessageText(message) {
                if (message.blocks) {
                    try {
                        const blocks = [];
                        for (const block of message.blocks) {
                            const elements = [];
                            if (!block.elements) {
                                console.log('Block has no elements', block);
                                return [];
                            }
                            for (const element of block.elements) {
                                const subElements = [];
                                for (const subElement of element.elements) {
                                    var content = '';
                                    switch (subElement.type) {
                                        case 'emoji':
                                            if (subElement.unicode) {
                                                for (const e of subElement.unicode.split('-')) {
                                                    content += String.fromCodePoint('0x' + e);
                                                }
                                            } else {
                                                content = subElement.name;
                                            }
                                            break;
                                        case 'text':
                                            content = subElement.text;
                                    }
                                    subElements.push(jml('span', { class: 'element_element ' + subElement.type }, content));
                                }
                                elements.push(jml('span', { class: 'block_element ' + element.type }, subElements));
                            }
                            blocks.push(jml('span', { class: 'message_block' }, elements))
                        }
        
                        return blocks;
    
                    } catch(err) {
                        console.error(err);
                        console.log(message);
                    }
                }

                return [ jml('span', {}, message.text) ];
            }

            async function renderMessageFiles(message) { 
                if (!message.files) return;

                const result = [];

                for (const file of message.files) {
                    if (!file.permalink) {
                        console.log('File missing permalink', file);
                        continue;
                    }
                    
                    const { file_index } = await import(`../archives/files/index.mjs`);
                    
                    let filename = file_index()[file.id]; 

                    var path = `../archives/files/${file.id}/${filename}`;

                    if (file.mimetype && file.mimetype.startsWith('image/')) {
                        result.push(jml('img', { src: path }));
                    } else {
                        result.push(jml('a', { href: path }, filename));
                    }
                }

                return result;
            }

            async function renderMessage([message, members], newGroup) {
                if (!message.type === 'message') return;

                var className = 'message_container';
                if (!newGroup) className += ' is_sequel';
                if (message.edited) className += ' is_edited';

                let date = getDate(message.ts);

                var user;
                if (message.subtype && message.subtype === "bot_message") {
                    user = members.find(m => m.profile && m.profile['api_app_id'] && m.profile['api_app_id'] === message['app_id']);
                } else if (members.find(m => m.id === message.user)) {
                    user = members.find(m => m.id === message.user);
                } else {
                    user = "???";
                }

                var content = renderMessageText(message);
                if (message.files) {
                    content.push(jml('figure', { class: 'message_files' }, await renderMessageFiles(message)));
                }
                if (message.edited) {
                    content.push(jml('span', { class: 'message_editTag' }, '(edited)'));
                }
                
                return jml('tr', { id: message.user, class: className }, [
                    jml('td', { class: 'message_ts' }, getDateString(date)),
                    jml('td', { class: 'message_user' }, newGroup ? getPrettyName(user) : ''),
                    jml('td', { class: 'message_content' }, content),
                ])
            }

            async function getMembers(channelMembersFileDir) {
                const { members } = await import(channelMembersFileDir);
                const { users } = await import('../archives/users/users-USLACKBOT.mjs');

                return users().filter(user => members().members.includes(user.id));
            }

            async function init(dir, ts) {
                const { info } = await import(dir + '/info.mjs');
                const members = await getMembers(dir + '/members.mjs')

                if (info()['is_im'] && info().user) {
                    let mem = members.find(member => member.id === info().user);
                    
                    setTitle('@' + mem.name);
                    document.querySelector('#channelTitle').innerHTML = getPrettyName(mem);   
                } else {
                    setTitle('#' + info().name);
                    document.querySelector('#channelTitle').innerHTML = info().name;
                    document.querySelector('#channelInfo').innerHTML = info().purpose.value.replace('\n', '<br>');    
                }
                
                for (const memberNode of renderMemberUI(members)) {
                    document.querySelector('#members').appendChild(memberNode);
                }
                
                const { message_index } = await import(dir + '/messages/index.mjs');

                for (var j = message_index().length - 1; j >=0; j--) {
                    let indexObj = message_index()[j];

                    const messagesObj = await import(dir + '/messages/' + makeFilename(indexObj.oldest) + '.mjs')
               
                    const messages = messagesObj.messages();

                    for (var i = messages.length - 1; i >= 0; i--) {
                        let newGroup = (!messages[i+1] || messages[i].user !== messages[i+1].user);
                        document.querySelector('#messages').appendChild(await renderMessage([messages[i], members], newGroup));
                    }
                }

            }

        </script>
        <link rel="stylesheet" href="main.css">
    </head>
    <body>
        <div id = 'members'></div>
        <h1 id = 'channelTitle'></h1>
        <h3 id = 'channelInfo'></h3>
        <div class = 'container'>
            <table id = 'messages'></table>
        </div>
    </body>
</html>
